name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish module package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Enable Yarn
        run: corepack enable

      - name: Check tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version '$TAG' does not match package.json version '$PKG'."
            echo "Bump package.json (yarn package uses that version), then tag v${PKG}."
            exit 1
          fi

      - name: Install
        run: yarn install
        env:
          CI: true

      - name: Test
        run: yarn test
        env:
          CI: true

      - name: Package
        run: yarn package
        env:
          CI: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGZ="astrastudio-onairscreen-${GITHUB_REF_NAME#v}.tgz"
          if [ ! -f "$TGZ" ]; then
            echo "Expected package file $TGZ was not produced."
            ls -la *.tgz || true
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$TGZ" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
